version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ponytail-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:05"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      ponytail-mcp:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
